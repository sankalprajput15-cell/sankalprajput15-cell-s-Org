# NOTE: GitHub Actions reads workflows from /.github/workflows/deploy.yml (with a leading dot).
# Both /.github/workflows/deploy.yml and this file have been updated with the working configuration.
name: Deploy Site to BigRock

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Production Bundle (./dist)
        run: npm run build

      - name: Sync Compiled Site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # If your FTP account lands directly in the website folder, leave server-dir as "./"
          # If it lands in root, use "public_html/"
          server-dir: ./
          local-dir: ./dist/

